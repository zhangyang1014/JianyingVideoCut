# GoldenClip 词库配置文件
# 修改后重启后端生效（热加载：也可调用 /api/reload-word-config）

# ─── 语气词 / 填充词 ───────────────────────────────────────────────────
# 出现在此列表中的词会被标记为 <FIL>，可在词级切除时删除
filler_words:
  - 嗯
  - 啊
  - 哦
  - 呃
  - 那个
  - 然后
  - 就是说
  - 就是
  - 这个
  - 对对对
  - 好好好
  - 嗯嗯
  - 啊啊
  - 哎
  - 诶
  - 嗯哼
  - 额
  - 哦哦
  - 对吧
  - 是吧
  - 怎么说呢

# ─── 复合词边界词典 ────────────────────────────────────────────────────
# "前字+当前字"在此列表中时，当前字虽与下一字相同，但不是结巴（复合词边界）
# 例：现在在家 → "现在"在列表中，"在"不标 <STU>
compound_word_endings:
  # 以"在"结尾
  - 现在
  - 正在
  - 还在
  - 已在
  - 仍在
  - 一直在
  # 以"以"结尾
  - 所以
  - 可以
  - 得以
  - 用以
  - 借以
  # 以"来"结尾
  - 过来
  - 回来
  - 进来
  - 出来
  - 上来
  - 下来
  - 前来
  # 以"去"结尾
  - 过去
  - 回去
  - 进去
  - 出去
  - 上去
  - 下去
  # 以"到"结尾
  - 想到
  - 说到
  - 做到
  - 看到
  - 听到
  - 感到
  - 得到
  # 以"上"结尾
  - 以上
  - 实际上
  - 事实上
  # 以"下"结尾
  - 以下
  - 底下
  - 手下
  # 以"前"结尾
  - 以前
  - 目前
  - 之前
  - 当前
  # 以"后"结尾
  - 以后
  - 之后
  - 然后
  - 最后

