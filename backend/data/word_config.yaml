# ─── 段首孤立助词 ─────────────────────────────────────────────────────
# 这些字单独出现在段首时，通常是上一句的语尾被 diarization 误切
# 配置为字符串（每个字符是一个助词）
leading_particles: "的嘛呢啊哦嗯吧呀哈噢喔了么吗"

# 段首孤立助词回并的最大间隔（毫秒），超过此间隔认为是有意义的停顿
particle_merge_max_gap_ms: 100

# ─── 段首非法标点 ─────────────────────────────────────────────────────
# 这些标点不能出现在句首，遇到时回并到上一段
leading_punct_to_merge: "，、；："
